/* =============================================================================
   NORTIQA — laboratorio: 500 cubos reflectantes
   -----------------------------------------------------------------------------
   Port del ejemplo `webgpu_materials_basic` de three.js, con dos cambios que
   pidió Leandro: CUBOS en vez de esferas, y un entorno TECH en vez de la foto
   de Pisa.

   ⚠️ POR QUÉ NO ES WebGPU, que era la primera versión de este archivo:

   `navigator.gpu` EXISTE bajo `file://` y el contexto es seguro —lo medí— pero
   `requestAdapter()` devuelve **null**. Verificado en el Chromium de Leandro:
   el ejemplo de three.js anda perfecto en threejs.org, que es `https`, y este
   documento no. Chrome no entrega adaptador WebGPU a un origen `file://`.

   El error de método fue mío y vale anotarlo: comprobé que la API EXISTE y
   concluí que FUNCIONA. Son dos cosas distintas, y la prueba real —pedir el
   adaptador— quedaba colgada en el headless, cosa que atribuí al entorno en
   vez de sospechar del origen.

   WebGL2 sí funciona con `file://` —el hero del sitio lo viene haciendo— así
   que el laboratorio va en WebGL2. El resultado visual es el mismo.

   Si algún día se quiere WebGPU o three.js de verdad, las dos cosas necesitan
   servir la carpeta:  python3 -m http.server  y abrir por `http://localhost`.

   El entorno es PROCEDIMENTAL, no un cubemap de seis PNG: se calcula en el
   shader a partir de la dirección, y sirve de fondo y de mapa de reflexión con
   la misma función —que es lo que hace el original, donde `scene.background` y
   el `envMap` son el mismo objeto— pero sin descargar nada.
   ========================================================================== */

  var aPos = gl.getAttribLocation(progCubo, 'aPos'), aNor = gl.getAttribLocation(progCubo, 'aNor');
  gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(aNor); gl.vertexAttribPointer(aNor, 3, gl.FLOAT, false, 24, 12);

  // Las magnitudes salen del original, no del ojo: esfera de radio 0,1 con
  // escala 1 a 4 —o sea diámetro 0,2 a 0,8— repartidas en un cubo de ±5, y la
  // cámara ADENTRO de esa nube. Eso es lo que hace que pasen cerca.
  var inst = new Float32Array(CUANTOS * 8);
  for (var i = 0; i < CUANTOS; i++) {
    var o = i * 8;
    inst[o]     = i;                                   // fase de la órbita
    inst[o + 1] = Math.random() * 10 - 5;              // z fijo
    inst[o + 2] = 0.2 + Math.random() * 0.6;           // arista del cubo
    inst[o + 3] = 0.1 + Math.random() * 0.35;          // velocidad de giro
    inst[o + 4] = Math.random();                       // fase del giro
    inst[o + 5] = 0;
    inst[o + 6] = 0;
    inst[o + 7] = 0;
  }
  var bufInst = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, bufInst);
  gl.bufferData(gl.ARRAY_BUFFER, inst, gl.STATIC_DRAW);
  var aInst = gl.getAttribLocation(progCubo, 'aInst'), aGiro = gl.getAttribLocation(progCubo, 'aGiro');
  gl.enableVertexAttribArray(aInst); gl.vertexAttribPointer(aInst, 4, gl.FLOAT, false, 32, 0);
  gl.vertexAttribDivisor(aInst, 1);
  gl.enableVertexAttribArray(aGiro); gl.vertexAttribPointer(aGiro, 4, gl.FLOAT, false, 32, 16);
  gl.vertexAttribDivisor(aGiro, 1);
  gl.bindVertexArray(null);

  var vaoFondo = gl.createVertexArray();   // el triángulo se genera en el shader

  var U = {
    fondoCam: gl.getUniformLocation(progFondo, 'uCam'),
    fondoAsp: gl.getUniformLocation(progFondo, 'uAspecto'),
    cuboVP:   gl.getUniformLocation(progCubo, 'uVistaProy'),
    cuboCam:  gl.getUniformLocation(progCubo, 'uCam'),
    cuboT:    gl.getUniformLocation(progCubo, 'uT'),
    cuboSom:  gl.getUniformLocation(progCubo, 'uSombra'),
    fondoTex: gl.getUniformLocation(progFondo, 'uPisa'),
    cuboTex:  gl.getUniformLocation(progCubo, 'uPisa')
  };

  /* --- El cubemap --------------------------------------------------------- */

  var CARAS = ['px', 'nx', 'py', 'ny', 'pz', 'nz'];
  var texto = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_CUBE_MAP, texto);
  // Ojo: para un cubemap el flip vertical va APAGADO. Las caras de OpenGL se
  // definen con el origen arriba a la izquierda, al reves que una textura 2D.
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  // Un pixel gris por cara mientras cargan, para que el primer cuadro dibuje.
  var gris = new Uint8Array([40, 50, 55, 255]);
  for (var c = 0; c < 6; c++) {
    gl.texImage2D(gl.TEXTURE_CUBE_MAP_POSITIVE_X + c, 0, gl.RGBA, 1, 1, 0,
                  gl.RGBA, gl.UNSIGNED_BYTE, gris);
  }
  var cargadas = 0;
  CARAS.forEach(function (nombre, idx) {
    var img = new Image();
    img.onload = function () {
      gl.bindTexture(gl.TEXTURE_CUBE_MAP, texto);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_CUBE_MAP_POSITIVE_X + idx, 0, gl.RGBA,
                    gl.RGBA, gl.UNSIGNED_BYTE, img);
      if (++cargadas === 6) gl.generateMipmap(gl.TEXTURE_CUBE_MAP);
    };
    img.onerror = function () { fallar('no cargo la cara ' + nombre + ' del cubemap'); };
    img.src = PISA[nombre];
  });

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_CUBE_MAP, texto);

  // Tecla S: prende y apaga el sombreado. Con 0 se ve el material del ejemplo
  // original tal cual -reflejo puro- y por que un CUBO se vuelve transparente
  // con el: una cara plana refleja UNA direccion, devuelve un color liso, y
  // cuando ese color coincide con el fondo la cara desaparece. En una ESFERA
  // el mismo material funciona porque comprime el entorno entero.
  var sombra = 0;
  addEventListener('keydown', function (e) {
    if (e.key === 's' || e.key === 'S') {
      sombra = sombra ? 0 : 1;
      document.getElementById('modo').textContent = sombra ? 'sombreado' : 'reflejo puro';
      pedir();
    }
  });

  /* --- Bucle -------------------------------------------------------------- */

  var ancho = 0, alto = 0;
  function medir() {
    var dpr = Math.min(devicePixelRatio || 1, 2);
    ancho = Math.max(1, Math.round(innerWidth * dpr));
    alto  = Math.max(1, Math.round(innerHeight * dpr));
    lienzo.width = ancho; lienzo.height = alto;
  }
  medir();
  addEventListener('resize', medir, { passive: true });

  var ratonX = 0, ratonY = 0, camX = 0, camY = 0;
  // Igual que el original: la posición del mouse en píxeles dividida por 100,
  // o sea que la cámara recorre unas ±7 unidades y atraviesa la nube.
  addEventListener('pointermove', function (e) {
    ratonX = (e.clientX - innerWidth / 2) / 100;
    ratonY = (e.clientY - innerHeight / 2) / 100;
  }, { passive: true });

  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = performance.now(), cuadros = 0, ultimoFps = t0, enCola = false;

  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);

  function cuadro(ahora) {
    enCola = false;
    if (document.hidden) return;

    var t = reduce ? 4 : (ahora - t0) / 1000;
    camX += (ratonX - camX) * 0.05;
    camY += (-ratonY - camY) * 0.05;
    // z = 3 y plano cercano en 0,01, los del original: la cámara queda DENTRO
    // de la nube y los cubos pueden pasarle por al lado sin recortarse.
    var ojo = [camX, camY, 3];
    var vp = multiplicar(perspectiva(60 * Math.PI / 180, ancho / alto, 0.01, 100),
                         mirarA(ojo, [0, 0, 0], [0, 1, 0]));

    gl.viewport(0, 0, ancho, alto);
    gl.clearColor(0.015, 0.03, 0.04, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    gl.depthMask(false);
    gl.useProgram(progFondo);
    gl.uniform1i(U.fondoTex, 0);
    gl.uniform3f(U.fondoCam, ojo[0], ojo[1], ojo[2]);
    gl.uniform1f(U.fondoAsp, ancho / alto);
    gl.bindVertexArray(vaoFondo);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.depthMask(true);

    gl.useProgram(progCubo);
    gl.uniformMatrix4fv(U.cuboVP, false, vp);
    gl.uniform3f(U.cuboCam, ojo[0], ojo[1], ojo[2]);
    gl.uniform1f(U.cuboT, t);
    gl.uniform1f(U.cuboSom, sombra);
    gl.uniform1i(U.cuboTex, 0);
    gl.bindVertexArray(vao);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 36, CUANTOS);

    cuadros++;
    if (ahora - ultimoFps > 500) {
      marcaFps.textContent = Math.round(cuadros * 1000 / (ahora - ultimoFps)) + ' fps';
      cuadros = 0; ultimoFps = ahora;
    }
    pedir();
  }

  // Guarda de bucle único, la misma disciplina que el resto del sitio.
  function pedir() {
    if (enCola || document.hidden) return;
    enCola = true;
    requestAnimationFrame(cuadro);
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) pedir(); });
  pedir();

  window.laboratorio = { gl: gl, cuantos: CUANTOS };
})();
    </script>
  </body>
</html>
